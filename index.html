<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fb8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duit Comel">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dina's Expenses Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg:#fff0f6;--card:rgba(255,255,255,.4);--hi:rgba(255,255,255,.8);--ink:#3d2f47;--mute:#8c7a96;--pink:#ff8fb8;--mint:#6fd3b6;--lav:#b9a6ff;--peach:#ffb98a;--line:rgba(180,150,200,.3);--veil:255,240,246;--inp:rgba(255,255,255,.9);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2133;--card:rgba(70,58,90,.32);--hi:rgba(255,255,255,.3);--ink:#f6eaff;--mute:#bba9c9;--line:rgba(255,255,255,.14);--veil:42,33,51;--inp:rgba(30,24,40,.8);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2133;--card:rgba(70,58,90,.32);--hi:rgba(255,255,255,.3);--ink:#f6eaff;--mute:#bba9c9;--line:rgba(255,255,255,.14);--veil:42,33,51;--inp:rgba(30,24,40,.8);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg),#e9e0ff 120%) fixed}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-2}
#veil{position:fixed;inset:0;background:rgba(var(--veil),var(--vo,.55));z-index:-1}
#app{width:calc(100% - 20px);max-width:460px;margin:12px auto 0;padding:12px 12px 2px;border-radius:36px;background:rgba(255,255,255,.4);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--hi);box-shadow:inset 0 1.5px 1px var(--hi),0 14px 40px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app{background:rgba(34,26,48,.5)}}
:root[data-theme="dark"] #app{background:rgba(34,26,48,.5)}
h1{font-size:22px;margin:6px 4px 12px;font-weight:800}
h2{font-size:15px;margin:16px 4px 8px;font-weight:800}
.card{background:var(--card);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border-radius:28px;padding:15px;margin: 12px 0px 12px 0;border:1px solid var(--hi);box-shadow:inset 0 1.5px 1px var(--hi),inset 0 -1px 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.16)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{width:38px;height:38px;border-radius:50%;border:0;background:var(--lav);color:#fff;font-size:20px;font-weight:800}
.big{font-size:30px;font-weight:800}
.mute{color:var(--mute);font-size:13px}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--lav))}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pill{border-radius:24px;padding:13px;color:var(--ink);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--hi);box-shadow:inset 0 1.5px 1px var(--hi),0 10px 30px rgba(0,0,0,.14)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row .ic{font-size:22px;width:38px;height:38px;border-radius:14px;background:rgba(255,143,184,.2);display:grid;place-items:center;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow-wrap:anywhere}
.amt{font-weight:800;white-space:nowrap}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--inp);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
input[type=date]{min-width:0;max-width:100%;min-height:44px;-webkit-appearance:none;appearance:none;text-align:left}
.btn{border:0;border-radius:16px;padding:12px 16px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pink),var(--lav));width:100%}
.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:12px}
.ghost{background:var(--line);color:var(--ink)}
.seg{display:flex;gap:8px;margin-bottom:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--inp);color:var(--ink);border-radius:14px;padding:10px;font:inherit;font-weight:700}
.seg button.on{background:var(--pink);color:#fff;border-color:var(--pink)}
.x{border:0;background:none;font-size:16px;color:var(--mute);padding:6px}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--lav);background:none;color:#fff;font-size:16px;flex:none}
.chk.on{background:var(--mint);border-color:var(--mint)}
.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:flex;gap:4px;background:var(--card);backdrop-filter:blur(32px) saturate(190%);-webkit-backdrop-filter:blur(32px) saturate(190%);border-radius:30px;padding:6px;border:1px solid var(--hi);box-shadow:inset 0 1.5px 1px var(--hi),0 12px 32px rgba(0,0,0,.22)}
.tabs button{flex:1;border:0;background:none;border-radius:20px;padding:7px 2px;font:inherit;font-size:11px;font-weight:700;color:var(--mute)}
.tabs button span{display:block;font-size:20px}
.tabs button.on{background:linear-gradient(135deg,var(--pink),var(--lav));color:#fff}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:700;font-size:13px;z-index:9;display:none}
.empty{text-align:center;color:var(--mute);padding:14px}
body::after{content:"";display:block;height:calc(150px + env(safe-area-inset-bottom,0px))}
.tabs{transition:transform .3s ease;will-change:transform}
@media (max-width:520px){.tabs.hide{transform:translateY(150%)}}
@media (max-width:520px){#app{width:calc(100% - 44px);margin:44px auto 0;padding:10px 10px 1px;border-radius:30px}h1{font-size:19px;margin:4px 4px 10px}h2{font-size:14px;margin:12px 4px 6px}.card{padding:12px;border-radius:22px;margin-bottom:10px}.big{font-size:26px}input,select,textarea{padding:9px 11px;margin-bottom:6px;border-radius:12px}input[type=date]{min-height:42px}.btn{padding:10px 14px}.row .ic{width:34px;height:34px;font-size:19px;border-radius:12px}.nav button{width:34px;height:34px}.pill{padding:10px;border-radius:20px}.tabs{padding:6px 22px calc(14px + env(safe-area-inset-bottom,0px))}.tabs button{padding:5px 2px;font-size:10px}.tabs button span{font-size:18px}}
</style>
</head>
<body>
<div id="bg"></div><div id="veil"></div>
<div id="toast"></div>
<div id="app"></div>
<div class="tabs"><div id="tabs"></div></div>
<script>
var K='duitcomel1',MN=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
var CATS=[['Makan','🍜'],['Grocery','🛒'],['Transport','🚗'],['Bil','💡'],['Shopping','🛍️'],['Hiburan','🎮'],['Kesihatan','💊'],['Lain','✨']];
var TABS=[['home','🏠','Utama'],['exp','🧾','Belanja'],['debt','🤝','Hutang'],['comm','📅','Komitmen'],['set','⚙️','Tetapan']];
var DEF={budget:1500,exp:[],debts:[],comm:[],bg:null,vo:.55};
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){return Object.assign({},DEF)}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}}
var S=load();S.exp.forEach(function(e){if(e.cat==='Runcit')e.cat='Grocery'});var tab='home',now=new Date(),cur={y:now.getFullYear(),m:now.getMonth()},armed='',dir='owed';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var rm=function(n){return 'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})};
var pad=function(n){return String(n).padStart(2,'0')};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var mk=function(){return cur.y+'-'+pad(cur.m+1)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
var sum=function(a,f){return a.reduce(function(t,x){return t+f(x)},0)};
var ce=function(n){var c=CATS.filter(function(c){return c[0]===n})[0];return c?c[1]:'✨'};
var val=function(id){var e=$('#'+id);return e?e.value:''};
function toast(t){var e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2200)}
function go(t){tab=t;armed='';render();window.scrollTo(0,0)}
function mv(d){cur.m+=d;if(cur.m<0){cur.m=11;cur.y--}if(cur.m>11){cur.m=0;cur.y++}armed='';render()}
function nav(){return '<div class="nav"><button onclick="mv(-1)">‹</button><b>'+MN[cur.m].slice(0,3)+' '+cur.y+'</b><button onclick="mv(1)">›</button></div>'}
function monthExp(){return S.exp.filter(function(e){return e.date.slice(0,7)===mk()}).sort(function(a,b){return b.date<a.date?-1:1})}
function isPaid(c){return !!(c.paid&&c.paid[mk()])}
function applyBg(){$('#bg').style.backgroundImage=S.bg?'url('+S.bg+')':'none';document.documentElement.style.setProperty('--vo',S.bg?S.vo:0)}
function delBtn(k,id){var a=armed===k+id;return '<button class="x" onclick="del(\''+k+'\',\''+id+'\')">'+(a?'Pasti? 🗑':'🗑')+'</button>'}
function del(k,id){if(armed!==k+id){armed=k+id;render();return}armed='';var m={exp:'exp',debt:'debts',comm:'comm'}[k];S[m]=S[m].filter(function(x){return x.id!==id});save();render()}

function vHome(){
 var ex=monthExp(),spent=sum(ex,function(e){return e.amt}),rem=S.budget-spent,pct=S.budget?Math.min(100,spent/S.budget*100):0;
 var un=S.comm.filter(function(c){return !isPaid(c)}),unAmt=sum(un,function(c){return c.amt});
 var owed=sum(S.debts.filter(function(d){return d.dir==='owed'}),function(d){return d.amt-d.paid});
 var iowe=sum(S.debts.filter(function(d){return d.dir==='iowe'}),function(d){return d.amt-d.paid});
 var by={};ex.forEach(function(e){by[e.cat]=(by[e.cat]||0)+e.amt});
 var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]}).map(function(c){return '<div class="row"><div class="ic">'+ce(c)+'</div><div class="t"><b>'+esc(c)+'</b><div class="bar" style="height:6px;margin:3px 0 0"><i style="width:'+(by[c]/spent*100)+'%"></i></div></div><div class="amt">'+rm(by[c])+'</div></div>'}).join('');
 return '<div class="pg"><div class="hd"><h1>Hi, Dina 🕊️</h1>'+nav()+'</div>'+
 '<div class="card"><div class="mute">Baki bajet bulan ni</div><div class="big" style="color:'+(rem<0?'#ff5c8a':'inherit')+'">'+rm(rem)+'</div><div class="bar" style="margin:6px 0 4px"><i style="width:'+pct+'%;'+(pct>=100?'background:#ff5c8a':'')+'"></i></div><div class="mute">Belanja '+rm(spent)+' / bajet '+rm(S.budget)+'</div></div>'+
 '<div class="grid"><div class="pill" style="background:rgba(255,143,184,.35)"><div style="font-size:12px">🌸 To Receive</div><b>'+rm(owed)+'</b></div><div class="pill" style="background:rgba(185,166,255,.38)"><div style="font-size:12px">💜 To Settle</div><b>'+rm(iowe)+'</b></div></div>'+
 '<div class="card"><div class="mute">📅 Komitmen belum bayar ('+un.length+')</div><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:20px">'+rm(unAmt)+'</b><span class="mute">Baki: <b>'+rm(rem-unAmt)+'</b></span></div></div>'+
 '<div class="card lst"><div class="mute">Ikut kategori</div>'+(cats||'<div class="empty">Belum ada belanja 🍃</div>')+'</div></div>'}

function expRow(e){return '<div class="row"><div class="ic">'+ce(e.cat)+'</div><div class="t"><b>'+esc(e.note||e.cat)+'</b><span class="mute">'+esc(e.cat)+' · '+e.date.slice(8)+'/'+e.date.slice(5,7)+'</span></div><div class="amt">'+rm(e.amt)+'</div>'+delBtn('exp',e.id)+'</div>'}
function vExp(){
 var ex=monthExp(),opts=CATS.map(function(c){return '<option>'+c[1]+' '+c[0]+'</option>'}).join('');
 return '<div class="pg"><div class="hd"><h1>🧾 Belanja</h1>'+nav()+'</div>'+
 '<div class="card"><div class="two"><input id="ea" type="number" inputmode="decimal" placeholder="Jumlah (RM)"><select id="ec">'+opts+'</select></div><div class="two"><input id="en" placeholder="Nota"><input id="ed" type="date" value="'+today()+'"></div><button class="btn" onclick="addExp()">Tambah 💖</button></div>'+
 '<div class="card" style="display:flex;justify-content:space-between;align-items:baseline"><span class="mute">Jumlah bulan ni</span><b style="font-size:20px">'+rm(sum(ex,function(e){return e.amt}))+'</b></div>'+
 '<div class="card lst">'+(ex.map(expRow).join('')||'<div class="empty">Takde rekod bulan ni 🍃</div>')+'</div></div>'}
function addExp(){var a=parseFloat(val('ea'));if(!(a>0))return toast('Masukkan jumlah dulu ya 🥺');
 var c=val('ec').split(' ').slice(1).join(' ');S.exp.push({id:uid(),amt:a,cat:c,note:val('en').trim(),date:val('ed')||today()});save();toast('Disimpan ✨');render()}

function dRow(d){var left=d.amt-d.paid,done=left<=0;
 return '<div style="padding:7px 0;border-bottom:1px dashed var(--line)"><div class="row" style="border:0;padding:0"><div class="t"><b>'+esc(d.name)+(done?' ✅':'')+'</b><span class="mute">'+esc(d.note||'')+(d.due?' · due '+d.due.slice(8)+'/'+d.due.slice(5,7):'')+' · asal '+rm(d.amt)+'</span></div><div class="amt">'+rm(left)+'</div>'+delBtn('debt',d.id)+'</div>'+(done?'':'<div style="display:flex;gap:6px;margin-top:6px"><input id="p'+d.id+'" type="number" inputmode="decimal" placeholder="Bayaran (RM)" style="margin:0"><button class="btn sm" onclick="pay(\''+d.id+'\')">Bayar</button><button class="btn sm ghost" onclick="pay(\''+d.id+'\',1)">Langsai</button></div>')+'</div>'}
function vDebt(){
 var A=S.debts.filter(function(d){return d.dir===dir}),tot=sum(A,function(d){return d.amt-d.paid});
 return '<div class="pg"><div class="hd"><h1>🤝 Hutang</h1></div>'+
 '<div class="seg"><button class="'+(dir==='owed'?'on':'')+'" onclick="dir=\'owed\';render()">🌸 To Receive</button><button class="'+(dir==='iowe'?'on':'')+'" onclick="dir=\'iowe\';render()">💜 To Settle</button></div>'+
 '<div class="card"><div class="two"><input id="dn" placeholder="Nama orang"><input id="da" type="number" inputmode="decimal" placeholder="Jumlah (RM)"></div><div class="two"><input id="dt" placeholder="Nota"><input id="dd" type="date"></div><button class="btn" onclick="addDebt()">Simpan 💜</button></div>'+
 '<div class="card lst"><div class="mute">Baki '+(dir==='owed'?'To Receive':'To Settle')+': <b>'+rm(tot)+'</b></div>'+(A.map(dRow).join('')||'<div class="empty">Takde 🍃</div>')+'</div></div>'}
function addDebt(){var a=parseFloat(val('da')),n=val('dn').trim();if(!n||!(a>0))return toast('Isi nama & jumlah ya 🥺');
 S.debts.push({id:uid(),name:n,dir:dir,amt:a,paid:0,note:val('dt').trim(),due:val('dd')});save();render()}
function pay(id,all){var d=S.debts.filter(function(x){return x.id===id})[0],a=all?d.amt-d.paid:parseFloat(val('p'+id));if(!(a>0))return toast('Masukkan jumlah bayaran');d.paid=Math.min(d.amt,d.paid+a);save();render()}

function vComm(){
 var tot=sum(S.comm,function(c){return c.amt}),paid=sum(S.comm.filter(isPaid),function(c){return c.amt});
 var rows=S.comm.slice().sort(function(a,b){return a.day-b.day}).map(function(c){var p=isPaid(c);return '<div class="row"><button class="chk '+(p?'on':'')+'" onclick="tgl(\''+c.id+'\')">'+(p?'✓':'')+'</button><div class="t"><b style="'+(p?'text-decoration:line-through;opacity:.6':'')+'">'+esc(c.name)+'</b><span class="mute">Setiap hari '+c.day+'</span></div><div class="amt">'+rm(c.amt)+'</div>'+delBtn('comm',c.id)+'</div>'}).join('');
 return '<div class="pg"><div class="hd"><h1>📅 Komitmen</h1>'+nav()+'</div>'+
 '<div class="grid"><div class="pill" style="background:rgba(111,211,182,.35)"><div style="font-size:12px">Dah bayar</div><b>'+rm(paid)+'</b></div><div class="pill" style="background:rgba(255,185,138,.38)"><div style="font-size:12px">Belum bayar</div><b>'+rm(tot-paid)+'</b></div></div>'+
 '<div class="card lst">'+(rows||'<div class="empty">Tambah komitmen kat bawah 🍃</div>')+'</div>'+
 '<div class="card"><input id="cn" placeholder="Nama (cth: ansuran kereta)"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px"><input id="ca" type="number" inputmode="decimal" placeholder="RM" style="margin:0"><input id="cd" type="number" inputmode="numeric" placeholder="Hari (1-31)" style="margin:0"><button class="btn sm" onclick="addComm()">Tambah 🌷</button></div></div></div>'}
function addComm(){var a=parseFloat(val('ca')),n=val('cn').trim(),d=parseInt(val('cd'))||1;if(!n||!(a>0))return toast('Isi nama & jumlah ya 🥺');S.comm.push({id:uid(),name:n,amt:a,day:Math.min(31,Math.max(1,d)),paid:{}});save();render()}
function tgl(id){var c=S.comm.filter(function(x){return x.id===id})[0];c.paid=c.paid||{};c.paid[mk()]=!c.paid[mk()];save();render()}

function vSet(){return '<div class="pg"><div class="hd"><h1>⚙️ Tetapan</h1></div>'+
 '<div class="card"><b>Bajet bulanan (RM)</b><div style="display:flex;gap:8px;margin-top:6px"><input id="sb" type="number" inputmode="decimal" value="'+S.budget+'" style="margin:0"><button class="btn sm" onclick="S.budget=parseFloat(val(\'sb\'))||0;save();toast(\'Disimpan 💖\')">Simpan</button></div></div>'+
 '<div class="card"><b>🖼️ Background sendiri</b><input id="sf" type="file" accept="image/*" onchange="setBg(this.files[0])" style="margin:6px 0"><div class="mute">Pudar (supaya senang fokus)</div><input type="range" min="0" max="0.9" step="0.05" value="'+S.vo+'" oninput="S.vo=+this.value;applyBg()" onchange="save()"><button class="btn ghost sm" style="width:100%" onclick="S.bg=null;save();applyBg();toast(\'Background dibuang\')">Buang background</button></div>'+
 '<div class="card"><b>💾 Backup</b><textarea id="bk" rows="2" placeholder="Backup keluar sini" style="margin:6px 0"></textarea><div class="two"><button class="btn sm" onclick="showBk()">Tunjuk backup</button><button class="btn sm ghost" onclick="restore()">Pulihkan</button></div></div>'+
 '<div class="card"><button class="btn ghost sm" style="width:100%" onclick="resetAll()">'+(armed==='rst'?'Pasti padam SEMUA? Tekan lagi':'Padam semua data')+'</button></div></div>'}
function setBg(f){if(!f)return;var r=new FileReader();r.onload=function(e){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.bg=c.toDataURL('image/jpeg',.7);if(!save()){S.bg=null;toast('Gambar terlalu besar 🥺')}else toast('Background siap 🌈');applyBg()};im.src=e.target.result};r.readAsDataURL(f)}
function showBk(){var o=Object.assign({},S);delete o.bg;$('#bk').value=JSON.stringify(o);$('#bk').select()}
function restore(){try{var o=JSON.parse(val('bk'));S=Object.assign({},DEF,o,{bg:S.bg});save();toast('Dipulihkan ✨');render()}catch(e){toast('Backup tak sah 🥺')}}
function resetAll(){if(armed!=='rst'){armed='rst';render();return}armed='';S=Object.assign({},DEF);save();applyBg();render()}

function render(){
 var v={home:vHome,exp:vExp,debt:vDebt,comm:vComm,set:vSet}[tab];
 $('#app').innerHTML=v();
 $('#tabs').innerHTML=TABS.map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
(function(){var last=0,tick=false,tb;function run(){tick=false;tb=tb||document.querySelector('.tabs');var y=window.pageYOffset||0,h=document.documentElement.scrollHeight-window.innerHeight;if(y<=0){tb.classList.remove('hide');last=0;return}if(y>=h)return;var d=y-last;if(Math.abs(d)<10)return;if(d<0)tb.classList.remove('hide');else tb.classList.add('hide');last=y}window.addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(run)}},{passive:true})})();
applyBg();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
